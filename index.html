<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon GTA 3D - Ultimate Engine Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        
        #rotate-notice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050d; color: #00f3ff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; font-size: 20px; text-align: center;
        }
        @media (orientation: landscape) { #rotate-notice { display: none; } }

        /* واجهة اللعبة - HUD */
        #hud {
            position: absolute; top: 12px; left: 12px; z-index: 10; color: #fff;
            background: rgba(5, 10, 20, 0.85); padding: 12px 18px; border-radius: 12px;
            border: 1px solid #00f3ff; box-shadow: 0 0 15px rgba(0,243,255,0.2); pointer-events: none; min-width: 200px;
        }
        .bar-box { width: 100%; height: 10px; background: #111; border-radius: 5px; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; background: #ff0055; transition: width 0.1s; }
        .bar-arm { background: #00f3ff; }
        .stars { color: #ffcc00; font-size: 16px; margin-top: 4px; }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 2px solid #00f3ff; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }

        /* مؤثر الرؤية الليلية */
        #night-vision-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 255, 50, 0.15); pointer-events: none; z-index: 5;
            display: none; border: 20px solid rgba(0,50,0,0.5);
        }

        /* تحكم الموبايل */
        .touch-ui {
            position: absolute; bottom: 15px; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 20; pointer-events: none;
        }
        #joystick-zone {
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 243, 255, 0.4); border-radius: 50%; position: relative; pointer-events: auto;
        }
        #joystick-knob {
            width: 45px; height: 45px; background: #00f3ff; border-radius: 50%;
            position: absolute; top: 37.5px; left: 37.5px; box-shadow: 0 0 15px #00f3ff;
        }
        .btn-group { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; max-width: 280px; justify-content: flex-end; }
        .act-btn {
            width: 55px; height: 55px; border-radius: 50%; background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00f3ff; color: #fff; font-size: 12px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .act-btn:active { background: #00f3ff; color: #000; }

        #weapon-bar { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 10; }
        .w-btn { background: rgba(0,0,0,0.8); border: 1px solid #00f3ff; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        .w-btn.active { background: #00f3ff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="rotate-notice">🔄 يرجى تدوير الهاتف للوضع الأفقي للعب!</div>
    <div id="night-vision-overlay"></div>

    <div id="hud">
        <div id="state-text" style="color:#00f3ff; font-weight:bold;">الوضع: مشاة 🚶</div>
        <div style="font-size:10px; margin-top:4px;">الصحة</div>
        <div class="bar-box"><div class="bar-fill" id="hp-bar"></div></div>
        <div style="font-size:10px; margin-top:2px;">الدرع</div>
        <div class="bar-box"><div class="bar-fill bar-arm" id="arm-bar"></div></div>
        <div class="stars" id="star-rank">المطاردة: ☆☆☆☆☆</div>
    </div>

    <div id="weapon-bar">
        <button class="w-btn active" onclick="setWep(1)">1: رشاش</button>
        <button class="w-btn" onclick="setWep(2)">2: شوتجن</button>
        <button class="w-btn" onclick="setWep(3)">3: RPG 🚀</button>
        <button class="w-btn" onclick="toggleNVG()" style="border-color:#00ff55; color:#00ff55;">ليلي 👁️</button>
    </div>

    <div id="crosshair"></div>

    <div class="touch-ui">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div class="btn-group">
            <div class="act-btn" id="btn-up" style="border-color:#00ff55; display:none;">صعود ⬆️</div>
            <div class="act-btn" id="btn-down" style="border-color:#00ff55; display:none;">هبوط ⬇️</div>
            <div class="act-btn" id="btn-enter" style="border-color:#ffcc00; color:#ffcc00;">ركوب [F]</div>
            <div class="act-btn" id="btn-shoot" style="border-color:#ff0055; color:#ff0055;">إطلاق 🔥</div>
            <div class="act-btn" id="btn-jump">قفز ⬆️</div>
        </div>
    </div>

    <script>
        // --- 1. محرك الصوت البرمجي Synthesizer ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'gun') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'rpg') {
                osc.type = 'square'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- 2. إعداد العالم الثلاثي الأبعاد THREE.JS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0x00f3ff, 0.8);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // الخريطة والأرضية
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(1200, 1200),
            new THREE.MeshStandardMaterial({ color: 0x080810, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(1200, 120, 0x00f3ff, 0x111122);
        grid.position.y = 0.1;
        scene.add(grid);

        // توليد أبراج ومباني المدينة
        for (let i = 0; i < 150; i++) {
            const h = Math.random() * 60 + 20;
            const w = Math.random() * 25 + 15;
            const d = Math.random() * 25 + 15;
            const bld = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshStandardMaterial({ color: 0x0d0d1a, metalness: 0.5, roughness: 0.2 })
            );
            let x = (Math.random() - 0.5) * 1000;
            let z = (Math.random() - 0.5) * 1000;
            if (Math.abs(x) < 50) x += 80;
            if (Math.abs(z) < 50) z += 80;

            bld.position.set(x, h/2, z);
            bld.castShadow = true; bld.receiveShadow = true;
            scene.add(bld);

            const wire = new THREE.LineSegments(
                new THREE.EdgesGeometry(bld.geometry),
                new THREE.LineBasicMaterial({ color: i % 2 === 0 ? 0x00f3ff : 0xff0055 })
            );
            wire.position.copy(bld.position);
            scene.add(wire);
        }

        // --- 3. الشخصيات والمركبات ---
        // اللاعب
        const playerGroup = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x00f3ff }));
        pBody.position.y = 1;
        playerGroup.add(pBody);
        scene.add(playerGroup);

        let hp = 100, armor = 100, wanted = 0, selectedWep = 1;

        // مصفوفة المركبات
        const vehicles = [];
        function createCar(x, z, color, isPolice = false) {
            const car = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.2, 4.8), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = 0.8;
            car.add(body);
            car.position.set(x, 0, z);
            car.userData = { type: 'car', speed: 0, isPolice: isPolice };
            scene.add(car);
            vehicles.push(car);
            return car;
        }

        // إنشاء طائرة هليكوبتر 🚁
        function createHeli(x, z) {
            const heli = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 6), new THREE.MeshStandardMaterial({ color: 0x00ff55 }));
            body.position.y = 1.5;
            heli.add(body);

            // مروحة الهليكوبتر
            const rotor = new THREE.Mesh(new THREE.BoxGeometry(8, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            rotor.position.set(0, 2.8, 0);
            heli.add(rotor);

            heli.position.set(x, 0, z);
            heli.userData = { type: 'heli', speed: 0, altitude: 0, rotor: rotor };
            scene.add(heli);
            vehicles.push(heli);
        }

        createCar(15, 15, 0xff0055);
        createCar(-30, 30, 0xffcc00);
        createHeli(0, 40); // هليكوبتر جاهزة للركوب

        // --- 4. التحكم وآليات اللعب ---
        let currentVehicle = null;
        let cameraAngle = { yaw: 0, pitch: 0 };
        let moveInput = { x: 0, y: 0 };
        let flyInput = 0; // ارتفاع وانخفاض الهليكوبتر
        const keys = {};

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyF') toggleVehicle();
            if (e.code === 'Space') jump();
            if (e.code === 'KeyE') flyInput = 0.3;
            if (e.code === 'KeyQ') flyInput = -0.3;
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'KeyE' || e.code === 'KeyQ') flyInput = 0;
        });

        // حركة الكاميرا بالماوس/التاتش
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === document.body) {
                cameraAngle.yaw -= e.movementX * 0.003;
                cameraAngle.pitch -= e.movementY * 0.003;
                cameraAngle.pitch = Math.max(-Math.PI/4, Math.min(Math.PI/4, cameraAngle.pitch));
            }
        });
        document.body.addEventListener('click', () => { if (window.innerWidth > 768) document.body.requestPointerLock(); });

        // التحكم باللمس
        const jZone = document.getElementById('joystick-zone');
        const jKnob = document.getElementById('joystick-knob');
        let jStartX = 0, jStartY = 0;

        jZone.addEventListener('touchstart', e => {
            const r = jZone.getBoundingClientRect(); jStartX = r.left + r.width/2; jStartY = r.top + r.height/2;
        });
        jZone.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            let dx = t.clientX - jStartX, dy = t.clientY - jStartY;
            let d = Math.min(Math.hypot(dx, dy), 40);
            let angle = Math.atan2(dy, dx);
            let kX = Math.cos(angle)*d, kY = Math.sin(angle)*d;
            jKnob.style.transform = `translate(${kX}px, ${kY}px)`;
            moveInput.x = kX / 40; moveInput.y = kY / 40;
        });
        jZone.addEventListener('touchend', () => { jKnob.style.transform = 'translate(0,0)'; moveInput = { x: 0, y: 0 }; });

        document.getElementById('btn-enter').addEventListener('click', toggleVehicle);
        document.getElementById('btn-jump').addEventListener('click', jump);
        document.getElementById('btn-shoot').addEventListener('click', shoot);
        document.getElementById('btn-up').addEventListener('touchstart', () => flyInput = 0.3);
        document.getElementById('btn-up').addEventListener('touchend', () => flyInput = 0);
        document.getElementById('btn-down').addEventListener('touchstart', () => flyInput = -0.3);
        document.getElementById('btn-down').addEventListener('touchend', () => flyInput = 0);

        function toggleNVG() {
            const nvg = document.getElementById('night-vision-overlay');
            nvg.style.display = nvg.style.display === 'block' ? 'none' : 'block';
        }

        function setWep(n) {
            selectedWep = n;
            document.querySelectorAll('.w-btn').forEach((b, i) => { if(i < 3) b.classList.toggle('active', i+1 === n); });
        }

        function toggleVehicle() {
            if (currentVehicle) {
                playerGroup.position.copy(currentVehicle.position).add(new THREE.Vector3(3, 0, 0));
                playerGroup.visible = true;
                currentVehicle = null;
                document.getElementById('state-text').textContent = "الوضع: مشاة 🚶";
                document.getElementById('btn-up').style.display = 'none';
                document.getElementById('btn-down').style.display = 'none';
            } else {
                vehicles.forEach(v => {
                    if (playerGroup.position.distanceTo(v.position) < 6) {
                        currentVehicle = v;
                        playerGroup.visible = false;
                        if (v.userData.type === 'heli') {
                            document.getElementById('state-text').textContent = "الوضع: طيران هليكوبتر 🚁";
                            document.getElementById('btn-up').style.display = 'flex';
                            document.getElementById('btn-down').style.display = 'flex';
                        } else {
                            document.getElementById('state-text').textContent = "الوضع: قيادة سيارة 🚘";
                        }
                    }
                });
            }
        }

        let pVelY = 0;
        function jump() { if (!currentVehicle && playerGroup.position.y <= 0.1) pVelY = 0.22; }

        const bullets = [];
        function shoot() {
            playSfx(selectedWep === 3 ? 'rpg' : 'gun');
            const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle.yaw);
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
            const pos = currentVehicle ? currentVehicle.position.clone().add(new THREE.Vector3(0,1.5,0)) : playerGroup.position.clone().add(new THREE.Vector3(0,1.2,0));
            b.position.copy(pos);
            b.userData = { vel: dir.multiplyScalar(2.5) };
            scene.add(b);
            bullets.push(b);
        }

        // --- 5. حلقة التكرار الرئيسية (Main Loop) ---
        function animate() {
            requestAnimationFrame(animate);

            let inX = moveInput.x || (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
            let inZ = moveInput.y || (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);

            if (!currentVehicle) {
                // مشاة
                const moveDir = new THREE.Vector3(inX, 0, inZ).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle.yaw);
                playerGroup.position.x += moveDir.x * 0.28;
                playerGroup.position.z += moveDir.z * 0.28;

                playerGroup.position.y += pVelY;
                if (playerGroup.position.y > 0) pVelY -= 0.012;
                else { playerGroup.position.y = 0; pVelY = 0; }

                if (moveDir.length() > 0) playerGroup.rotation.y = Math.atan2(moveDir.x, moveDir.z);

                const cOff = new THREE.Vector3(0, 2.5, 5).applyAxisAngle(new THREE.Vector3(1,0,0), cameraAngle.pitch).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngle.yaw);
                camera.position.copy(playerGroup.position).add(cOff);
                camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

            } else if (currentVehicle.userData.type === 'car') {
                // سيارة
                let spd = currentVehicle.userData.speed;
                if (inZ < 0) spd = Math.min(spd + 0.03, 1.2);
                else if (inZ > 0) spd = Math.max(spd - 0.02, -0.4);
                else spd *= 0.96;
                currentVehicle.userData.speed = spd;

                if (Math.abs(spd) > 0.05) {
                    currentVehicle.rotation.y += ((inX < 0 ? 1 : 0) - (inX > 0 ? 1 : 0)) * 0.035 * (spd > 0 ? 1 : -1);
                }
                currentVehicle.translateZ(-spd);

                const cOff = new THREE.Vector3(0, 4.5, 10).applyAxisAngle(new THREE.Vector3(0,1,0), currentVehicle.rotation.y);
                camera.position.copy(currentVehicle.position).add(cOff);
                camera.lookAt(currentVehicle.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            } else if (currentVehicle.userData.type === 'heli') {
                // هليكوبتر
                currentVehicle.userData.rotor.rotation.y += 0.4; // دوران المروحة
                currentVehicle.position.y = Math.max(0, currentVehicle.position.y + flyInput);

                const moveDir = new THREE.Vector3(inX, 0, inZ).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngle.yaw);
                currentVehicle.position.x += moveDir.x * 0.4;
                currentVehicle.position.z += moveDir.z * 0.4;

                const cOff = new THREE.Vector3(0, 6, 14).applyAxisAngle(new THREE.Vector3(0,1,0), cameraAngle.yaw);
                camera.position.copy(currentVehicle.position).add(cOff);
                camera.lookAt(currentVehicle.position);
            }

            // تحديث الطلقات
            bullets.forEach((b, i) => {
                b.position.add(b.userData.vel);
                if (b.position.length() > 400) { scene.remove(b); bullets.splice(i, 1); }
            });

            document.getElementById('hp-bar').style.width = `${hp}%`;
            document.getElementById('arm-bar').style.width = `${armor}%`;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
