<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سارق الجواهر</title>
<style>
:root{--b:#0a0e17;--p:#161f30;--a:#00ffcc;--e:#ff0055;--g:#ffcc00}
body{background:var(--b);color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;user-select:none;touch-action:manipulation}
.hdr{display:flex;justify-content:space-between;width:340px;max-width:90vw;margin-bottom:8px;font-weight:700}
.hdr span{color:var(--a)}
.cvs-cnt{border-radius:12px;border:2px solid var(--a);box-shadow:0 0 20px rgba(0,255,204,.2);overflow:hidden}
canvas{background:#04060c;display:block}
.ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:180px;margin-top:12px}
.btn{background:var(--p);color:#fff;border:1px solid var(--a);font-size:18px;height:45px;border-radius:8px;cursor:pointer}
.btn:active{background:var(--a);color:#000}
.rst{margin-top:10px;padding:6px 16px;background:none;color:#888;border:1px solid #444;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="hdr"><div>النقاط: <span id="s">0</span></div><div>الأعلى: <span id="h">0</span></div></div>
<div class="cvs-cnt"><canvas id="c" width="340" height="340"></canvas></div>
<div class="ctrls">
<div></div><button class="btn" onclick="m(0,-1)">▲</button><div></div>
<button class="btn" onclick="m(-1,0)">◄</button><button class="btn" onclick="m(0,1)">▼</button><button class="btn" onclick="m(1,0)">►</button>
</div>
<button class="rst" onclick="i()">إعادة اللعب</button>

<script>
const cvs=document.getElementById("c"),ctx=cvs.getContext("2d"),S=id=>document.getElementById(id);
let p={x:170,y:170,r:10,sp:18},gems=[],eList=[],score=0,hs=localStorage.getItem("thief_h")||0,over=0,tmr=0;
S("h").textContent=hs;

document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp")m(0,-1);if(e.key==="ArrowDown")m(0,1);
if(e.key==="ArrowLeft")m(-1,0);if(e.key==="ArrowRight")m(1,0);
});

function m(dx,dy){
if(over)return;
p.x=Math.max(15,Math.min(325,p.x+dx*p.sp));
p.y=Math.max(15,Math.min(325,p.y+dy*p.sp));
}

function addG(){
gems.push({x:Math.random()*290+25,y:Math.random()*290+25,r:7});
}

function addE(){
let x=Math.random()>0.5?15:325,y=Math.random()*310+15;
eList.push({x:x,y:y,r:9,sp:Math.random()*0.8+0.8+(score/50)});
}

function update(){
if(over)return;
tmr++;
if(gems.length<3)addG();
if(eList.length<2+Math.floor(score/30) && tmr%120===0)addE();

// جمع الجواهر
for(let k=gems.length-1;k>=0;k--){
let g=gems[k];
if(Math.hypot(p.x-g.x,p.y-g.y)<p.r+g.r){
gems.splice(k,1);score+=10;S("s").textContent=score;
if(score>hs){hs=score;localStorage.setItem("thief_h",hs);S("h").textContent=hs}
}
}

// تحريك الأعداء ومطاردة اللاعب
eList.forEach(e=>{
let a=Math.atan2(p.y-e.y,p.x-e.x);
e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp;
if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){over=1;draw();}
});
}

function draw(){
ctx.clearRect(0,0,340,340);

// رسم الجواهر
ctx.fillStyle="#ffcc00";ctx.shadowColor="#ffcc00";ctx.shadowBlur=8;
gems.forEach(g=>{ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill()});

// رسم اللاعب
ctx.fillStyle="#00ffcc";ctx.shadowColor="#00ffcc";ctx.shadowBlur=12;
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();

// رسم الأعداء
ctx.fillStyle="#ff0055";ctx.shadowColor="#ff0055";ctx.shadowBlur=10;
eList.forEach(e=>{ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill()});
ctx.shadowBlur=0;

if(over){
ctx.fillStyle="rgba(4,6,12,0.85)";ctx.fillRect(0,0,340,340);
ctx.fillStyle="#ff0055";ctx.font="bold 22px sans-serif";ctx.textAlign="center";
ctx.fillText("تم القبض عليك!",170,150);
ctx.fillStyle="#fff";ctx.font="15px sans-serif";
ctx.fillText(`مجموع الجواهر: ${score}`,170,185);
}
}

function loop(){
update();draw();
if(!over)requestAnimationFrame(loop);
}

function i(){
p.x=170;p.y=170;gems=[];eList=[];score=0;over=0;tmr=0;
S("s").textContent=0;addG();addE();loop();
}
i();
</script>
</body>
</html>
