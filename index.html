<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان الواقعية</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .score-board {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .score-board span {
            color: #4ade80;
        }

        canvas {
            background-color: #020617;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            border-radius: 12px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1>لعبة الثعبان الواقعية</h1>
    <div class="score-board">النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button onclick="resetGame()">إعادة اللعب</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let speed = 120;
        let gameTimeout;
        let gameStarted = false;

        document.addEventListener("keydown", changeDirection);

        function main() {
            if (hasGameEnded()) {
                drawGameOver();
                return;
            }

            gameTimeout = setTimeout(() => {
                clearCanvas();
                drawGrid();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, speed);
        }

        function clearCanvas() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
        }

        function drawFood() {
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            const radius = gridSize / 2 - 2;

            ctx.save();
            ctx.shadowColor = "#f43f5e";
            ctx.shadowBlur = 12;
            ctx.fillStyle = "#f43f5e";
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ffe4e6";
            ctx.beginPath();
            ctx.arc(centerX - radius/3, centerY - radius/3, radius/3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const x = part.x * gridSize;
                const y = part.y * gridSize;
                const centerX = x + gridSize / 2;
                const centerY = y + gridSize / 2;
                const radius = gridSize / 2 - 1;

                ctx.save();
                if (index === 0) {
                    ctx.shadowColor = "#4ade80";
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = "#22c55e";
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#ffffff";
                    let eyeX1 = centerX, eyeY1 = centerY, eyeX2 = centerX, eyeY2 = centerY;

                    if (dx === 1) { eyeX1 = eyeX2 = centerX + 4; eyeY1 = centerY - 4; eyeY2 = centerY + 4; }
                    else if (dx === -1) { eyeX1 = eyeX2 = centerX - 4; eyeY1 = centerY - 4; eyeY2 = centerY + 4; }
                    else if (dy === -1) { eyeY1 = eyeY2 = centerY - 4; eyeX1 = centerX - 4; eyeX2 = centerX + 4; }
                    else { eyeY1 = eyeY2 = centerY + 4; eyeX1 = centerX - 4; eyeX2 = centerX + 4; }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "#000000";
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 1, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 1, 0, Math.PI * 2);
                    ctx.fill();

                } else {
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(74, 222, 128, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius - 1, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            });
        }

        function moveSnake() {
            if (!gameStarted) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                if (speed > 50) speed -= 2;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT && !goingRight) { dx = -1; dy = 0; gameStarted = true; }
            if (keyPressed === UP && !goingDown) { dx = 0; dy = -1; gameStarted = true; }
            if (keyPressed === RIGHT && !goingLeft) { dx = 1; dy = 0; gameStarted = true; }
            if (keyPressed === DOWN && !goingUp) { dx = 0; dy = 1; gameStarted = true; }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function hasGameEnded() {
            if (!gameStarted) return false;

            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) return true;

            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            return false;
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(2, 6, 23, 0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f43f5e";
            ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "16px Arial";
            ctx.fillText(`مجموع نقاطك: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
        }

        function resetGame() {
            clearTimeout(gameTimeout);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            speed = 120;
            gameStarted = false;
            scoreElement.textContent = score;
            generateFood();
            main();
        }

        resetGame();
    </script>
</body>
</html>
