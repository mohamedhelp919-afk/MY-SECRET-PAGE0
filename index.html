<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حروب النيون: ملحمة الفضاء - Neon Wars</title>
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #ff0055;
            --gold: #ffcc00;
            --bg: #030308;
            --panel: rgba(10, 15, 30, 0.85);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .game-wrapper {
            position: relative;
            width: 95vw;
            max-width: 900px;
            height: 85vh;
            max-height: 650px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 243, 255, 0.4);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD - واجهة التحكم والأرقام */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 5;
        }

        .hud-card {
            background: var(--panel);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-title {
            font-size: 11px;
            color: #88a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary);
        }

        .bar-container {
            width: 120px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            transition: width 0.2s ease-out;
        }

        .bar-shield {
            background: linear-gradient(90deg, #00f3ff, #0077ff);
        }

        /* شاشة النهاية والقائمة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 8, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 42px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            text-align: center;
        }

        .subtitle {
            font-size: 16px;
            color: #aab;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #0055ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
        }

        .controls-hint {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #668;
        }

        .boss-bar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            background: var(--panel);
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--secondary);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }

        /* أدوات التحكم للهواتف الذكية */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 6;
            pointer-events: none;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        .touch-btn:active {
            background: var(--primary);
            color: #000;
        }

        @media (max-width: 768px) {
            .touch-controls { display: flex; }
            .controls-hint { display: none; }
            .title { font-size: 30px; }
        }
    </style>
</head>
<body>

    <div class="game-wrapper" id="wrapper">
        <!-- واجهة الأرقام والمعلومات -->
        <div class="hud">
            <div class="hud-card">
                <span class="hud-title">الطاقة والدرع</span>
                <div class="bar-container"><div class="bar-fill" id="hp-bar"></div></div>
                <div class="bar-container" style="margin-top:2px;"><div class="bar-fill bar-shield" id="shield-bar"></div></div>
            </div>

            <div class="hud-card" style="align-items: center;">
                <span class="hud-title">الموجة</span>
                <span class="hud-value" id="wave-val" style="color:var(--gold)">1</span>
            </div>

            <div class="hud-card" style="align-items: flex-end;">
                <span class="hud-title">النتيجة</span>
                <span class="hud-value" id="score-val">0000</span>
            </div>
        </div>

        <!-- شريط الزعيم -->
        <div class="boss-bar-container" id="boss-hud">
            <span class="hud-title" style="color:var(--secondary); font-weight:bold;">تنبيه: تحذير من زعيم الفضاء!</span>
            <div class="bar-container" style="width:100%; height:12px;">
                <div class="bar-fill" id="boss-hp" style="background:var(--secondary); width:100%;"></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- الشاشة الرئيسية/النهاية -->
        <div class="overlay" id="overlay">
            <h1 class="title" id="main-title">حروب النيون</h1>
            <p class="subtitle" id="sub-title">استعد لمواجهة أساطيل الأعداء وغزو الزعماء في أقصى أبعاد المجرة.</p>
            <button class="btn-start" onclick="startGame()">ابدأ المعركة 🔥</button>

            <div class="controls-hint">
                <span>الحركة: W A S D / الأسهم</span>
                <span>الإطلاق: Space / زر الفأرة</span>
                <span>القنبلة الشاملة: Key E</span>
            </div>
        </div>

        <!-- أزرار اللمس للموبايل -->
        <div class="touch-controls">
            <div style="display:flex; gap:10px;">
                <div class="touch-btn" id="t-left">◄</div>
                <div class="touch-btn" id="t-right">►</div>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="touch-btn" id="t-bomb" style="border-color:var(--gold); color:var(--gold);">💣</div>
                <div class="touch-btn" id="t-fire" style="border-color:var(--secondary); color:var(--secondary);">🔥</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const wrapper = document.getElementById("wrapper");

        // ضبط أبعاد الشاشة
        let W = canvas.width = wrapper.clientWidth;
        let H = canvas.height = wrapper.clientHeight;

        window.addEventListener("resize", () => {
            W = canvas.width = wrapper.clientWidth;
            H = canvas.height = wrapper.clientHeight;
        });

        // المتغيرات العامة للعبة
        let gameActive = false;
        let score = 0;
        let wave = 1;
        let keys = {};
        let touch = { left: false, right: false, fire: false, bomb: false };
        let cameraShake = 0;

        // المدخلات والتحكم
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        // إعدادات اللمس
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener("touchstart", (e) => { e.preventDefault(); touch[key] = true; });
            el.addEventListener("touchend", (e) => { e.preventDefault(); touch[key] = false; });
        };
        bindTouch("t-left", "left");
        bindTouch("t-right", "right");
        bindTouch("t-fire", "fire");
        bindTouch("t-bomb", "bomb");

        // الكائنات الفضائية والمؤثرات
        let player;
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let stars = [];
        let boss = null;

        // تهيئة خلفية النجوم المترية
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                size: Math.random() * 2,
                speed: Math.random() * 3 + 0.5,
                opacity: Math.random()
            });
        }

        // كائن اللاعب (السفينة الفضائية)
        class Player {
            constructor() {
                this.x = W / 2;
                this.y = H - 80;
                this.w = 40;
                this.h = 45;
                this.vx = 0;
                this.vy = 0;
                this.speed = 0.6;
                this.friction = 0.92;
                this.hp = 100;
                this.maxHp = 100;
                this.shield = 50;
                this.maxShield = 50;
                this.weaponLevel = 1;
                this.fireTimer = 0;
                this.bombs = 1;
            }

            update() {
                // الفيزياء والحركة
                if (keys["ArrowLeft"] || keys["KeyA"] || touch.left) this.vx -= this.speed;
                if (keys["ArrowRight"] || keys["KeyD"] || touch.right) this.vx += this.speed;
                if (keys["ArrowUp"] || keys["KeyW"]) this.vy -= this.speed;
                if (keys["ArrowDown"] || keys["KeyS"]) this.vy += this.speed;

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // الحدود
                this.x = Math.max(20, Math.min(W - 20, this.x));
                this.y = Math.max(50, Math.min(H - 40, this.y));

                // إعادة شحن الدرع تلقائياً
                if (this.shield < this.maxShield) this.shield += 0.03;

                // الإطلاق
                this.fireTimer++;
                if ((keys["Space"] || touch.fire) && this.fireTimer > 8) {
                    this.shoot();
                    this.fireTimer = 0;
                }

                // القنبلة
                if ((keys["KeyE"] || touch.bomb) && this.bombs > 0) {
                    this.useBomb();
                    touch.bomb = false;
                    keys["KeyE"] = false;
                }
            }

            shoot() {
                if (this.weaponLevel === 1) {
                    bullets.push(new Bullet(this.x, this.y - 20, 0, -12, "#00f3ff"));
                } else if (this.weaponLevel >= 2) {
                    bullets.push(new Bullet(this.x - 12, this.y - 10, -1, -12, "#00f3ff"));
                    bullets.push(new Bullet(this.x + 12, this.y - 10, 1, -12, "#00f3ff"));
                }
                createParticles(this.x, this.y + 15, 2, "#00f3ff", 1);
            }

            useBomb() {
                this.bombs--;
                cameraShake = 20;
                createParticles(W / 2, H / 2, 100, "#ffcc00", 8);
                enemies.forEach(e => e.takeDamage(150));
                enemyBullets = [];
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // رسم محرك السفينة (النار)
                ctx.fillStyle = Math.random() > 0.5 ? "#ff0055" : "#ffcc00";
                ctx.beginPath();
                ctx.moveTo(-8, 15);
                ctx.lineTo(0, 25 + Math.random() * 10);
                ctx.lineTo(8, 15);
                ctx.fill();

                // جسم السفينة الرئيسي
                ctx.shadowColor = "#00f3ff";
                ctx.shadowBlur = 15;
                ctx.fillStyle = "#00f3ff";
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(-20, 15);
                ctx.lineTo(0, 5);
                ctx.lineTo(20, 15);
                ctx.closePath();
                ctx.fill();

                // رسم هالة الدرع
                if (this.shield > 5) {
                    ctx.strokeStyle = `rgba(0, 243, 255, ${this.shield / this.maxShield})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 28, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // الطلقات
        class Bullet {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.alive = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.alive = false;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // الكائنات والمعادون
        class Enemy {
            constructor(type) {
                this.type = type; // 1: Chaser, 2: Shooter
                this.x = Math.random() * (W - 60) + 30;
                this.y = -40;
                this.alive = true;
                this.timer = 0;

                if (type === 1) {
                    this.hp = 20;
                    this.speed = 2 + Math.random();
                    this.color = "#ff0055";
                    this.r = 16;
                } else {
                    this.hp = 40;
                    this.speed = 1.2;
                    this.color = "#ffcc00";
                    this.r = 22;
                }
            }

            update() {
                this.y += this.speed;
                this.timer++;

                if (this.type === 2 && this.timer % 90 === 0) {
                    // إطلاق النار نحو اللاعب
                    let angle = Math.atan2(player.y - this.y, player.x - this.x);
                    enemyBullets.push(new Bullet(this.x, this.y, Math.cos(angle) * 4, Math.sin(angle) * 4, "#ff0055"));
                }

                if (this.y > H + 40) this.alive = false;
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                createParticles(this.x, this.y, 5, this.color, 2);
                if (this.hp <= 0) {
                    this.alive = false;
                    score += this.type === 1 ? 15 : 35;
                    createParticles(this.x, this.y, 20, this.color, 4);
                    cameraShake = 5;

                    // إسقاط الجوائز بمعدل احترافي
                    if (Math.random() < 0.25) {
                        powerups.push(new PowerUp(this.x, this.y));
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;

                if (this.type === 1) {
                    ctx.beginPath();
                    ctx.moveTo(0, 15);
                    ctx.lineTo(-12, -12);
                    ctx.lineTo(12, -12);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    ctx.fillRect(-15, -15, 30, 30);
                }

                ctx.restore();
            }
        }

        // الزعيم الكبير (Boss)
        class Boss {
            constructor() {
                this.x = W / 2;
                this.y = -100;
                this.targetY = 100;
                this.hp = 600 + wave * 200;
                this.maxHp = this.hp;
                this.alive = true;
                this.timer = 0;
                this.color = "#ff0055";
            }

            update() {
                if (this.y < this.targetY) this.y += 1;

                this.x += Math.sin(this.timer * 0.03) * 2;
                this.timer++;

                // النمط الهجومي للزعيم
                if (this.timer % 40 === 0) {
                    for (let i = -2; i <= 2; i++) {
                        enemyBullets.push(new Bullet(this.x + i * 15, this.y + 30, i * 1.5, 5, "#ff0055"));
                    }
                }

                document.getElementById("boss-hp").style.width = `${(this.hp / this.maxHp) * 100}%`;
            }

            takeDamage(dmg) {
                this.hp -= dmg;
                createParticles(this.x, this.y, 4, "#ffcc00", 3);
                if (this.hp <= 0) {
                    this.alive = false;
                    score += 500;
                    createParticles(this.x, this.y, 80, "#ff0055", 8);
                    cameraShake = 25;
                    document.getElementById("boss-hud").style.display = "none";
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = "#111";
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.moveTo(0, 40);
                ctx.lineTo(-50, -20);
                ctx.lineTo(-30, -40);
                ctx.lineTo(30, -40);
                ctx.lineTo(50, -20);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        // مكافآت الجوائز
        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = Math.random() < 0.5 ? "weapon" : "shield";
                this.alive = true;
            }

            update() {
                this.y += 1.5;
                if (this.y > H + 20) this.alive = false;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.type === "weapon" ? "#ffcc00" : "#00f3ff";
                ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // الذرات والانفجارات
        function createParticles(x, y, count, color, speed) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let spd = Math.random() * speed + 0.5;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 1,
                    color: color
                });
            }
        }

        // بدء اللعبة
        function startGame() {
            document.getElementById("overlay").classList.add("hidden");
            player = new Player();
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            boss = null;
            score = 0;
            wave = 1;
            gameActive = true;
            requestAnimationFrame(gameLoop);
        }

        // دورة اللعبة الرئيسية (Game Loop)
        function gameLoop() {
            if (!gameActive) return;

            // تحديث الخلفية والاهتزاز
            ctx.fillStyle = "rgba(3, 3, 8, 0.3)";
            ctx.fillRect(0, 0, W, H);

            ctx.save();
            if (cameraShake > 0) {
                ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
                cameraShake *= 0.9;
            }

            // رسم حركة النجوم
            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > H) s.y = 0;
                ctx.globalAlpha = s.opacity;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;

            // تحديث اللاعب
            player.update();
            player.draw();

            // توليد الأعداء بناء على الموجة
            if (!boss && enemies.length < 3 + wave * 2 && Math.random() < 0.03) {
                enemies.push(new Enemy(Math.random() > 0.4 ? 1 : 2));
            }

            // توليد الزعيم
            if (score >= wave * 300 && !boss) {
                boss = new Boss();
                document.getElementById("boss-hud").style.display = "flex";
            }

            // تحديث الطلقات
            bullets.forEach((b, i) => {
                b.update();
                b.draw();
                if (!b.alive) bullets.splice(i, 1);
            });

            enemyBullets.forEach((eb, i) => {
                eb.update();
                eb.draw();

                // اصطدام القذائف باللاعب
                if (Math.hypot(eb.x - player.x, eb.y - player.y) < 20) {
                    if (player.shield > 0) player.shield -= 15;
                    else player.hp -= 15;
                    createParticles(player.x, player.y, 5, "#ff0055", 2);
                    eb.alive = false;
                    cameraShake = 8;
                }
                if (!eb.alive) enemyBullets.splice(i, 1);
            });

            // تحديث الأعداء والاصطدامات
            enemies.forEach((e, i) => {
                e.update();
                e.draw();

                // اصطدام طلقات اللاعب بالأعداء
                bullets.forEach(b => {
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 5) {
                        e.takeDamage(15);
                        b.alive = false;
                    }
                });

                // اصطدام اللاعب بالعدو
                if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + 15) {
                    e.takeDamage(50);
                    player.hp -= 20;
                    cameraShake = 12;
                }

                if (!e.alive) enemies.splice(i, 1);
            });

            // تحديث الزعيم إن وجد
            if (boss) {
                boss.update();
                boss.draw();
                bullets.forEach(b => {
                    if (Math.hypot(b.x - boss.x, b.y - boss.y) < 50) {
                        boss.takeDamage(10);
                        b.alive = false;
                    }
                });
                if (!boss.alive) {
                    boss = null;
                    wave++;
                }
            }

            // الجوائز والمكافآت
            powerups.forEach((p, i) => {
                p.update();
                p.draw();
                if (Math.hypot(player.x - p.x, player.y - p.y) < 25) {
                    if (p.type === "weapon") player.weaponLevel = Math.min(player.weaponLevel + 1, 2);
                    else player.shield = player.maxShield;
                    p.alive = false;
                }
                if (!p.alive) powerups.splice(i, 1);
            });

            // تحديث الذرات الانفجارية
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 2, 2);
                ctx.globalAlpha = 1;
                if (p.life <= 0) particles.splice(i, 1);
            });

            ctx.restore();

            // تحديث الواجهة والنتائج
            document.getElementById("hp-bar").style.width = `${Math.max(0, player.hp)}%`;
            document.getElementById("shield-bar").style.width = `${Math.max(0, (player.shield / player.maxShield) * 100)}%`;
            document.getElementById("score-val").textContent = score;
            document.getElementById("wave-val").textContent = wave;

            // الخسارة
            if (player.hp <= 0) {
                gameOver();
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            gameActive = false;
            document.getElementById("overlay").classList.remove("hidden");
            document.getElementById("main-title").textContent = "انتهت المعركة!";
            document.getElementById("sub-title").textContent = `نقاطك النهائية: ${score} - وصلت للموجة رقم: ${wave}`;
        }
    </script>
</body>
</html>
