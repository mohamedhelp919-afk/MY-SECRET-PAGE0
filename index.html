<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بناء البرج - Tower Stacker Game Ultra</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #58a6ff;
            --danger-color: #f85149;
            --text-color: #c9d1d9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 360px;
            max-width: 90vw;
            margin-bottom: 12px;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .score-box {
            font-size: 16px;
            font-weight: 700;
        }
        .score-box span {
            color: var(--accent-color);
            font-size: 18px;
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 0 35px rgba(88, 166, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            background: #010409;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            width: 360px;
            max-width: 90vw;
        }
        .btn {
            background: linear-gradient(135deg, #1f6beb, #238636);
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            border: none;
            height: 52px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            transition: transform 0.1s, filter 0.2s;
            flex: 1;
        }
        .btn:active {
            transform: scale(0.97);
            filter: brightness(1.2);
        }
        .restart-btn {
            background: linear-gradient(135deg, #da3633, #f85149);
            box-shadow: 0 4px 15px rgba(218, 54, 51, 0.4);
        }
        .instruction {
            margin-top: 10px;
            font-size: 13px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">الارتفاع: <span id="score">0</span></div>
        <div class="score-box">أعلى قياس: <span id="high">0</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="360" height="480"></canvas>
    </div>

    <div class="controls">
        <button class="btn" onclick="handleAction()">إسقاط الكتلة ⬛</button>
        <button class="btn restart-btn" onclick="resetGame()">إعادة 🔄</button>
    </div>

    <div class="instruction">اضغط على الشاشة أو زر الإسقاط للبناء!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highEl = document.getElementById("high");

        let stack = [];
        let debris = [];
        let score = 0;
        let highScore = localStorage.getItem("stack_high_val") || 0;
        let gameOver = false;
        let cameraY = 0;
        let targetCameraY = 0;

        highEl.textContent = highScore;

        // حالة الكتلة المتحركة المباشرة
        let activeBlock = {
            x: 0,
            y: 0,
            width: 200,
            height: 30,
            speed: 3,
            direction: 1,
            color: "#58a6ff"
        };

        function getRandomColor(hue) {
            return `hsl(${hue % 360}, 85%, 60%)`;
        }

        function init() {
            stack = [{
                x: 80,
                y: 430,
                width: 200,
                height: 30,
                color: getRandomColor(0)
            }];
            debris = [];
            score = 0;
            gameOver = false;
            cameraY = 0;
            targetCameraY = 0;
            scoreEl.textContent = 0;
            spawnBlock();
            requestAnimationFrame(gameLoop);
        }

        function spawnBlock() {
            const topBlock = stack[stack.length - 1];
            activeBlock.width = topBlock.width;
            activeBlock.height = 30;
            activeBlock.x = 0;
            activeBlock.y = topBlock.y - 30;
            activeBlock.speed = 3 + Math.min(score * 0.2, 7);
            activeBlock.direction = 1;
            activeBlock.color = getRandomColor(score * 15);
        }

        function handleAction() {
            if (gameOver) {
                resetGame();
                return;
            }

            const topBlock = stack[stack.length - 1];
            const diff = activeBlock.x - topBlock.x;
            const overlap = activeBlock.width - Math.abs(diff);

            if (overlap > 0) {
                // اقتطاع الكتلة الزائدة
                let newWidth = overlap;
                let newX = diff > 0 ? activeBlock.x : topBlock.x;

                // إنشاء جزء ساقط (Debris)
                let debrisX = diff > 0 ? newX + newWidth : activeBlock.x;
                let debrisWidth = Math.abs(diff);
                debris.push({
                    x: debrisX,
                    y: activeBlock.y,
                    width: debrisWidth,
                    height: activeBlock.height,
                    vy: 0,
                    color: activeBlock.color
                });

                // إضافة الكتلة للبرج
                stack.push({
                    x: newX,
                    y: activeBlock.y,
                    width: newWidth,
                    height: activeBlock.height,
                    color: activeBlock.color
                });

                score++;
                scoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("stack_high_val", highScore);
                    highEl.textContent = highScore;
                }

                // تحريك الكاميرا للأعلى عند ارتفاع البرج
                if (stack.length > 5) {
                    targetCameraY += 30;
                }

                spawnBlock();
            } else {
                // الخسارة عند تفويت الكتلة تماماً
                debris.push({
                    x: activeBlock.x,
                    y: activeBlock.y,
                    width: activeBlock.width,
                    height: activeBlock.height,
                    vy: 0,
                    color: activeBlock.color
                });
                gameOver = true;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                handleAction();
            }
        });

        canvas.addEventListener("click", handleAction);

        function update() {
            if (gameOver) return;

            // تحريك الكتلة الحالية
            activeBlock.x += activeBlock.speed * activeBlock.direction;
            if (activeBlock.x + activeBlock.width > canvas.width) {
                activeBlock.direction = -1;
            } else if (activeBlock.x < 0) {
                activeBlock.direction = 1;
            }

            // تحريك الأجزاء الساقطة
            debris.forEach(d => {
                d.vy += 0.5;
                d.y += d.vy;
            });

            // تنعيم حركة الكاميرا
            cameraY += (targetCameraY - cameraY) * 0.1;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, cameraY);

            // رسم البرج الثابت
            stack.forEach((b) => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.strokeRect(b.x, b.y, b.width, b.height);
            });

            // رسم الكتلة المتحركة
            if (!gameOver) {
                ctx.fillStyle = activeBlock.color;
                ctx.shadowColor = activeBlock.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(activeBlock.x, activeBlock.y, activeBlock.width, activeBlock.height);
                ctx.shadowBlur = 0;
            }

            // رسم الأجزاء المتساقطة
            debris.forEach((d) => {
                ctx.fillStyle = d.color;
                ctx.fillRect(d.x, d.y, d.width, d.height);
            });

            ctx.restore();

            // شاشة انتهاء اللعبة
            if (gameOver) {
                ctx.fillStyle = "rgba(13, 17, 23, 0.88)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f85149";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("سقط البرج!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#c9d1d9";
                ctx.font = "16px sans-serif";
                ctx.fillText(`الارتفاع النهائي: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.font = "13px sans-serif";
                ctx.fillText("اضغط هنا للعب من جديد", canvas.width / 2, canvas.height / 2 + 55);
            }
        }

        function gameLoop() {
            update();
            draw();
            if (!gameOver || debris.some(d => d.y - cameraY < canvas.height)) {
                requestAnimationFrame(gameLoop);
            }
        }

        function resetGame() {
            init();
        }

        init();
    </script>
</body>
</html>
