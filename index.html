<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قلب بحبك كتير</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .heart {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: #ff3366;
            transform: rotate(-45deg);
            animation: beat 1.2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px #ff3366;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .heart:before {
            top: -150px;
            left: 0;
        }

        .heart:after {
            left: 150px;
            top: 0;
        }

        .text-overlay {
            position: absolute;
            transform: rotate(45deg); /* لتعديل ميلان النص */
            color: white;
            z-index: 10;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            white-space: pre-wrap;
            pointer-events: none;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        @keyframes beat {
            0% { transform: scale(1) rotate(-45deg); }
            15% { transform: scale(1.2) rotate(-45deg); }
            30% { transform: scale(1) rotate(-45deg); }
            45% { transform: scale(1.15) rotate(-45deg); }
            60% { transform: scale(1) rotate(-45deg); }
        }
    </style>
</head>
<body>

    <div class="heart">
        <div class="text-overlay">
            بحبك كتير<br>❤️
        </div>
    </div>

</body>
</html>
