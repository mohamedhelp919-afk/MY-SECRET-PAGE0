<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Online - تسجيل الدخول للشبكة</title>
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء خط تجوال العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card-container">
        <!-- شعار وتفاصيل الشبكة -->
        <div class="logo-header">
            <div class="icon-wifi">📶</div>
            <h1>Star Online</h1>
            <p>مرحباً بك في شبكة الواي فاي</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" action="$(link-login-only)" method="post">
            <div class="input-group">
                <label for="username">رقم الكارت / الكود</label>
                <input type="text" id="username" name="username" placeholder="أدخل كود الشحن هنا" required autocomplete="off">
            </div>

            <!-- خيار كلمة السر إذا كانت الشبكة تتطلب اسم مستخدم وكلمة سر -->
            <div class="input-group hidden" id="passwordGroup">
                <label for="password">كلمة السر</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة السر">
            </div>

            <button type="submit" class="btn-primary">دخول للشبكة</button>
        </form>

        <div class="divider"><span>أو</span></div>

        <!-- أزرار الإجراءات السريعة -->
        <div class="actions">
            <button class="btn-secondary" onclick="checkStatus()">معرفة الرصيد / المتبقي</button>
            <a href="https://wa.me/201000000000" class="btn-whatsapp" target="_blank">
                الدعم الفني عبر واتساب
            </a>
        </div>

        <!-- أسعار الكروت / الباقات -->
        <div class="pricing-section">
            <h3>أسعار كروت الواي فاي</h3>
            <div class="price-tags">
                <div class="tag"><span>5 ج.م</span> 1 جيجا / يوم</div>
                <div class="tag"><span>10 ج.م</span> 3 جيجا / 3 أيام</div>
                <div class="tag"><span>25 ج.م</span> 10 جيجا / أسبوع</div>
            </div>
        </div>

        <div class="footer">
            <p>جميع الحقوق محفوظة &copy; 2026 Star Online</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
