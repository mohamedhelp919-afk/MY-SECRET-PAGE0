<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بناء البرج</title>
<style>
:root{--b:#0d1117;--a:#58a6ff;--d:#f85149}
body{background:var(--b);color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;user-select:none;touch-action:manipulation}
.hdr{display:flex;justify-content:space-between;width:340px;max-width:90vw;margin-bottom:10px;font-weight:700}
.hdr span{color:var(--a)}
.cvs-cnt{border-radius:12px;border:2px solid var(--a);box-shadow:0 0 20px rgba(88,166,255,.2);overflow:hidden}
canvas{background:#010409;display:block;cursor:pointer}
.ctrls{display:flex;gap:10px;width:340px;max-width:90vw;margin-top:10px}
.btn{background:#1f6beb;color:#fff;font-size:16px;font-weight:700;border:none;height:45px;border-radius:8px;cursor:pointer;flex:1}
.btn:active{transform:scale(.97)}
.rst{background:var(--d)}
</style>
</head>
<body>
<div class="hdr"><div>الارتفاع: <span id="s">0</span></div><div>الأعلى: <span id="h">0</span></div></div>
<div class="cvs-cnt"><canvas id="c" width="340" height="420"></canvas></div>
<div class="ctrls">
<button class="btn" onclick="act()">إسقاط الكتلة ⬛</button>
<button class="btn rst" onclick="init()">إعادة 🔄</button>
</div>

<script>
const cvs=document.getElementById("c"),ctx=cvs.getContext("2d"),S=i=>document.getElementById(i);
let stk=[],deb=[],score=0,hs=localStorage.getItem("stk_h")||0,over=0,camY=0,tCamY=0;
let cur={x:0,y:0,w:180,h:26,sp:3,d:1,c:""};
S("h").textContent=hs;

function gCol(h){return `hsl(${h%360},80%,60%)`}

function spawn(){
let top=stk[stk.length-1];
cur.w=top.w;cur.x=0;cur.y=top.y-26;
cur.sp=3+Math.min(score*0.2,7);cur.d=1;
cur.c=gCol(score*15);
}

function act(){
if(over){init();return}
let top=stk[stk.length-1],diff=cur.x-top.x,ovl=cur.w-Math.abs(diff);
if(ovl>0){
let nw=ovl,nx=diff>0?cur.x:top.x;
deb.push({x:diff>0?nx+nw:cur.x,y:cur.y,w:Math.abs(diff),h:26,vy:0,c:cur.c});
stk.push({x:nx,y:cur.y,w:nw,h:26,c:cur.c});
score++;S("s").textContent=score;
if(score>hs){hs=score;localStorage.setItem("stk_h",hs);S("h").textContent=hs}
if(stk.length>5)tCamY+=26;
spawn();
}else{
deb.push({x:cur.x,y:cur.y,w:cur.w,h:26,vy:0,c:cur.c});
over=1;
}
}

document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp")act()});
cvs.addEventListener("click",act);

function update(){
if(over)return;
cur.x+=cur.sp*cur.d;
if(cur.x+cur.w>340)cur.d=-1;else if(cur.x<0)cur.d=1;
deb.forEach(d=>{d.vy+=0.5;d.y+=d.vy});
camY+=(tCamY-camY)*0.1;
}

function draw(){
ctx.clearRect(0,0,340,420);
ctx.save();ctx.translate(0,camY);

stk.forEach(b=>{
ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
ctx.strokeStyle="rgba(0,0,0,0.2)";ctx.strokeRect(b.x,b.y,b.w,b.h);
});

if(!over){
ctx.fillStyle=cur.c;ctx.shadowColor=cur.c;ctx.shadowBlur=8;
ctx.fillRect(cur.x,cur.y,cur.w,cur.h);ctx.shadowBlur=0;
}

deb.forEach(d=>{ctx.fillStyle=d.c;ctx.fillRect(d.x,d.y,d.w,d.h)});
ctx.restore();

if(over){
ctx.fillStyle="rgba(13,17,23,.88)";ctx.fillRect(0,0,340,420);
ctx.fillStyle="#f85149";ctx.font="bold 24px sans-serif";ctx.textAlign="center";
ctx.fillText("سقط البرج!",170,190);
ctx.fillStyle="#fff";ctx.font="15px sans-serif";
ctx.fillText(`الارتفاع النهائي: ${score}`,170,225);
}
}

function loop(){
update();draw();
if(!over||deb.some(d=>d.y-camY<420))requestAnimationFrame(loop);
}

function init(){
stk=[{x:80,y:380,w:180,h:26,c:gCol(0)}];
deb=[];score=0;over=0;camY=0;tCamY=0;
S("s").textContent=0;spawn();loop();
}
init();
</script>
</body>
</html>
