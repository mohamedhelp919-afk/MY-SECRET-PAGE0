<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة الزمن التكنولوجية - كيرلس المود</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Canvas خلفية 3D */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* واجهة التفاعل العلوي */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            pointer-events: none;
        }

        header {
            text-align: center;
            pointer-events: auto;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            background: linear-gradient(90deg, #00ffcc, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1rem;
            color: #a0a0b0;
            margin-top: 5px;
        }

        /* كارت عرض الحقبة التكنولوجية */
        .era-card {
            background: rgba(15, 15, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            margin: 0 auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .era-card h2 {
            font-size: 2rem;
            color: #00ffcc;
            margin-bottom: 10px;
            transition: color 0.5s ease;
        }

        .era-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d1d1e0;
        }

        /* الشريط الزمني للتنقل */
        .timeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
            background: rgba(10, 10, 18, 0.8);
            padding: 15px 30px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: fit-content;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .time-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 22px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .time-btn:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transform: translateY(-2px);
        }

        .time-btn.active {
            background: #00ffcc;
            color: #050508;
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="ui-container">
        <header>
            <h1>محاكي آلة الزمن التكنولوجية</h1>
            <p>إعداد الطالب: كيرلس المود</p>
        </header>

        <div class="era-card" id="eraCard">
            <h2 id="eraTitle">عام 1940: بداية الكمبيوتر الأول</h2>
            <p id="eraDesc">ظهور أجهزة الصمامات المفرغة والمحركات الميكانيكية الضخمة، حيث كانت أجهزة الكمبيوتر تشغل غرفاً كاملة وتزن أطنانًا.</p>
        </div>

        <div class="timeline">
            <button class="time-btn active" onclick="switchEra(0)">1940</button>
            <button class="time-btn" onclick="switchEra(1)">1970</button>
            <button class="time-btn" onclick="switchEra(2)">2000</button>
            <button class="time-btn" onclick="switchEra(3)">2026</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // بيانات الحقبات الزمنية
        const eras = [
            {
                year: "1940: بداية الكمبيوتر الأول",
                desc: "عصر الصمامات المفرغة وحاسوب ENIAC. تميزت الأجهزة بالضخامة والبطء مع الاعتماد الكامل على البطاقات المثقوبة.",
                color: 0xffa500,
                geometryType: 'box'
            },
            {
                year: "1970: ثورة المعالجات الدقيقة",
                desc: "ظهور أول شرائح الميكروبروسيسور والدوائر المتكاملة، وتأسيس بدايات الكمبيوتر الشخصي واللغات البرمجية الحديثة.",
                color: 0x00ff88,
                geometryType: 'octahedron'
            },
            {
                year: "2000: انفجار الإنترنت وشبكات الويب",
                desc: "انتشار شبكة الإنترنت العالمية (World Wide Web)، ظهور الهواتف الذكية الأولى، وتطوير الرسوميات ثلاثية الأبعاد.",
                color: 0x0099ff,
                geometryType: 'torus'
            },
            {
                year: "2026: عصر الذكاء الاصطناعي والحوسبة الفائقة",
                desc: "هيمنة النماذج التوليدية الذكية، الحوسبة الكمومية، والواجهات التفاعلية ثلاثية الأبعاد فائقة السرعة.",
                color: 0x7928ca,
                geometryType: 'knot'
            }
        ];

        // إعداد مشهد Three.js
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // إضافة الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.5);
        pointLight.position.set(20, 20, 20);
        scene.add(pointLight);

        // إنشاء جزيئات خلفية (Stars/Particles)
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1200;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 80;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // إنشاء الكائن 3D الرئيسي المتغير
        let currentMesh;

        function create3DObject(eraIndex) {
            if (currentMesh) scene.remove(currentMesh);

            let geometry;
            const era = eras[eraIndex];

            switch(era.geometryType) {
                case 'box':
                    geometry = new THREE.BoxGeometry(10, 10, 10);
                    break;
                case 'octahedron':
                    geometry = new THREE.OctahedronGeometry(8);
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(8, 2.5, 16, 100);
                    break;
                case 'knot':
                    geometry = new THREE.TorusKnotGeometry(6, 2, 100, 16);
                    break;
            }

            const material = new THREE.MeshStandardMaterial({
                color: era.color,
                wireframe: true,
                roughness: 0.3,
                metalness: 0.8
            });

            currentMesh = new THREE.Mesh(geometry, material);
            scene.add(currentMesh);
        }

        camera.position.z = 25;

        // التفاعل مع حركة الماوس
        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        // تحريك المشهد
        function animate() {
            requestAnimationFrame(animate);

            if (currentMesh) {
                currentMesh.rotation.x += 0.005 + mouseY;
                currentMesh.rotation.y += 0.01 + mouseX;
            }

            particlesMesh.rotation.y -= 0.0008;

            renderer.render(scene, camera);
        }

        // التبديل بين الحقبات
        function switchEra(index) {
            const buttons = document.querySelectorAll('.time-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            buttons[index].classList.add('active');

            const era = eras[index];
            document.getElementById('eraTitle').innerText = era.year;
            document.getElementById('eraDesc').innerText = era.desc;
            document.getElementById('eraTitle').style.color = '#' + era.color.toString(16);

            create3DObject(index);
        }

        // إعداد البداية
        create3DObject(0);
        animate();

        // تجاوب الشاشة عند التكبير/التصغير
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
