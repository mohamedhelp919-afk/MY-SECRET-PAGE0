<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>i love you قلب جزيئات -  </title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* خلفية سوداء مثل الفيديو */
        }

        canvas {
            display: block;
        }

        .text-container {
            position: absolute;
            top: 20%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 3rem;
            text-shadow: 0 0 20px #ff3366;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="text-container">بحبك كتير</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 1500; // عدد النقاط

        // إحداثيات رسم القلب
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 15, y: y * 15 };
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.t = Math.random() * Math.PI * 2;
                const target = getHeartPoint(this.t);
                this.targetX = target.x + canvas.width / 2;
                this.targetY = target.y + canvas.height / 2 + 50;
                
                // نقطة البداية (عشوائية)
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                
                this.size = Math.random() * 2 + 1;
                this.speed = Math.random() * 0.05 + 0.02;
                this.color = `rgba(173, 216, 230, ${Math.random()})`; // لون أزرق فاتح مثل الفيديو
            }

            update() {
                // حركة الجزيئات باتجاه شكل القلب
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;

                // إضافة حركة "نبض" خفيفة
                this.x += Math.sin(Date.now() * 0.002 + this.t) * 0.5;
                this.y += Math.cos(Date.now() * 0.002 + this.t) * 0.5;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            // مسح الشاشة مع ترك أثر بسيط (توهج)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles.length = 0;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
