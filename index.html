<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الثعبان بالأزرار</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --snake-color: #22c55e;
            --snake-head: #4ade80;
            --food-color: #ef4444;
            --btn-bg: #334155;
            --btn-active: #475569;
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 360px;
            max-width: 90vw;
            margin-bottom: 10px;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .score-box {
            font-size: 16px;
            font-weight: bold;
        }

        .score-box span {
            color: var(--snake-head);
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        canvas {
            background-color: #020617;
            display: block;
        }

        .controls-container {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 55px);
            gap: 10px;
        }

        .btn {
            background-color: var(--btn-bg);
            color: white;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #1e293b;
            transition: all 0.1s ease;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1e293b;
            background-color: var(--btn-active);
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .restart-btn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="score-box">النقاط: <span id="score">0</span></div>
        <div class="score-box">أعلى نتيجة: <span id="highScore">0</span></div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="360" height="360"></canvas>
    </div>

    <div class="controls-container">
        <button class="btn btn-up" onclick="changeDir('UP')">▲</button>
        <button class="btn btn-left" onclick="changeDir('LEFT')">◄</button>
        <button class="btn btn-down" onclick="changeDir('DOWN')">▼</button>
        <button class="btn btn-right" onclick="changeDir('RIGHT')">►</button>
    </div>

    <button class="restart-btn" onclick="resetGame()">إعادة اللعب</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const GRID_SIZE = 18;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snake_high") || 0;
        let gameInterval;
        let gameStarted = false;

        document.getElementById("highScore").textContent = highScore;

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") changeDir('UP');
            if (e.key === "ArrowDown") changeDir('DOWN');
            if (e.key === "ArrowLeft") changeDir('LEFT');
            if (e.key === "ArrowRight") changeDir('RIGHT');
        });

        function changeDir(direction) {
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (direction === 'LEFT' && !goingRight) { dx = -1; dy = 0; gameStarted = true; }
            if (direction === 'UP' && !goingDown) { dx = 0; dy = -1; gameStarted = true; }
            if (direction === 'RIGHT' && !goingLeft) { dx = 1; dy = 0; gameStarted = true; }
            if (direction === 'DOWN' && !goingUp) { dx = 0; dy = 1; gameStarted = true; }
        }

        function gameLoop() {
            if (hasGameEnded()) {
                drawGameOver();
                clearInterval(gameInterval);
                return;
            }

            clearCanvas();
            drawGrid();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawGrid() {
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#ef4444";
            ctx.shadowColor = "#ef4444";
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(
                food.x * GRID_SIZE + GRID_SIZE / 2,
                food.y * GRID_SIZE + GRID_SIZE / 2,
                GRID_SIZE / 2 - 2, 0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? "#4ade80" : "#22c55e";
                
                if (isHead) {
                    ctx.shadowColor = "#4ade80";
                    ctx.shadowBlur = 6;
                }

                ctx.beginPath();
                ctx.roundRect(
                    part.x * GRID_SIZE + 1,
                    part.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2,
                    isHead ? 5 : 3
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function moveSnake() {
            if (!gameStarted) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snake_high", highScore);
                    document.getElementById("highScore").textContent = highScore;
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT);
            food.y = Math.floor(Math.random() * TILE_COUNT);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function hasGameEnded() {
            if (!gameStarted) return false;

            const hitLeft = snake[0].x < 0;
            const hitRight = snake[0].x >= TILE_COUNT;
            const hitTop = snake[0].y < 0;
            const hitBottom = snake[0].y >= TILE_COUNT;

            if (hitLeft || hitRight || hitTop || hitBottom) return true;

            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            return false;
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(2, 6, 23, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 24px Arial";
            ctx.textAlign = "center";
            ctx.fillText("انتهت اللعبة!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "14px Arial";
            ctx.fillText(`النقاط: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameStarted = false;
            document.getElementById("score").textContent = score;
            generateFood();
            gameInterval = setInterval(gameLoop, 100);
        }

        resetGame();
    </script>
</body>
</html>
